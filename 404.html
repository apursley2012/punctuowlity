<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1" />
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src &#x27;self&#x27;; script-src &#x27;self&#x27;; style-src &#x27;self&#x27; https://fonts.googleapis.com; font-src &#x27;self&#x27; https://fonts.gstatic.com; img-src &#x27;self&#x27; data:; connect-src &#x27;none&#x27;; object-src &#x27;none&#x27;; base-uri &#x27;self&#x27;; form-action &#x27;self&#x27;" />

			name="author"
			content="Alysha Pursley" />
		<meta
			name="theme-color"
			content="#2F3653" />
		<title>Page Not Found | PunctuOwlity</title>
		<link
			rel="stylesheet"
			href="styles/shared.css" />
		<link
			rel="stylesheet"
			href="styles/pages/legal.css" />
	</head>
	<body>
		<a
			class="skip-link"
			href="#main-content">
			Skip to main content
		</a>
		<header class="topbar">
			<a
				class="icon-button back legal-back"
				href="pages/index.html"
				aria-label="Back to PunctuOwlity">
				←
			</a>
		</header>
		<main
			id="main-content"
			class="legal-page">
			<h1>Page Not Found</h1>

				We couldn’t find the page you requested. The link may be outdated or the

			<p>
				<a
					class="button-link"
					href="pages/index.html">
					Return to PunctuOwlity
				</a>
			</p>
		</main>
		<footer
			class="site-footer"
			aria-label="Project information">
			<a href="pages/privacy.html">Privacy</a>
			<a href="pages/terms.html">Terms &amp; Demo</a>
			<a href="pages/licenses.html">Licenses &amp; Attribution</a>
		</footer>
	</body>
