<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src &#x27;self&#x27;; script-src &#x27;self&#x27;; style-src &#x27;self&#x27; https://fonts.googleapis.com; font-src &#x27;self&#x27; https://fonts.gstatic.com; img-src &#x27;self&#x27; data:; connect-src &#x27;none&#x27;; object-src &#x27;none&#x27;; base-uri &#x27;self&#x27;; form-action &#x27;self&#x27;" />
		<meta
			content="Alysha Pursley"
			name="author" />
		<meta
			content="width=device-width,initial-scale=1"
			name="viewport" />
		<title>Login | PunctuOwlity</title>
		<link
			href="../styles/shared.css"
			rel="stylesheet" />
		<link
			href="../styles/components/buttons.css"
			rel="stylesheet" />
		<link
			href="../styles/components/forms.css"
			rel="stylesheet" />
		<link
			href="../styles/components/feedback.css"
			rel="stylesheet" />
		<link
			href="../styles/pages/index.css"
			rel="stylesheet" />
		<meta
			content="Sign in to the PunctuOwlity event-tracking browser demo and manage personal events and reminders."
			name="description" />
		<meta
			content="#2F3653"
			name="theme-color" />
	</head>
	<body data-page="login">
		<a
			class="skip-link"
			href="#main-content">
			Skip to main content
		</a>
		<header
			class="topbar"
			data-topbar=""></header>
		<main
			class="auth-page"
			id="main-content">
			<div class="login-stack">
				<div class="logo">
					<img
						alt="PunctuOwlity Event Tracking"
						height="169"
						src="../assets/punctuowlity-logo.png"
						width="260" />
				</div>
				<h1>Welcome to PunctuOwlity!</h1>
				<form
					class="form-card"
					id="loginForm"
					novalidate="">
					<div class="field">
						<label
							class="sr-only"
							for="editUsername">
							Username
						</label>
						<input
							autocomplete="username"
							id="editUsername"
							maxlength="80"
							placeholder="Username or Email"
							required=""
							type="text" />
					</div>
					<div class="field password-field">
						<label
							class="sr-only"
							for="editPassword">
							Password
						</label>
						<input
							autocomplete="current-password"
							id="editPassword"
							maxlength="128"
							placeholder="Password"
							required=""
							type="password" />
						<button
							aria-label="Show password"
							class="toggle-password"
							type="button"></button>
					</div>
					<button
						class="button coral"
						type="submit">
						Login
					</button>
					<p>Don’t have an account?</p>
					<a
						class="button turquoise"
						href="signup.html">
						Sign Up
					</a>
				</form>
			</div>
		</main>
		<script src="../scripts/core/core.js"></script>
		<script src="../scripts/core/password-security.js"></script>
		<script src="../scripts/core/account-storage.js"></script>
		<script src="../scripts/components/icons.js"></script>
		<script src="../scripts/components/topbar.js"></script>
		<script src="../scripts/components/feedback.js"></script>
		<script src="../scripts/components/password-toggle.js"></script>
		<script src="../scripts/pages/login-page.js"></script>
		<script src="../scripts/core/bootstrap.js"></script>
		<footer
			class="site-footer"
			aria-label="Project information">
			<a href="privacy.html">Privacy</a>
			<a href="terms.html">Terms &amp; Demo</a>
			<a href="licenses.html">Licenses &amp; Attribution</a>
		</footer>
	</body>
</html>
